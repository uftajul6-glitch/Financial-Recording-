<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ==================== META TAGS SEO ==================== -->
  <title>Financial Recording by bby Taztsuu</title>
  <meta name="description" content="Aplikasi pencatatan keuangan Financial Recording by bby Taztsuu. Catat pemasukan, pengeluaran, dan rekap bulanan secara rapi.">
  <meta name="keywords" content="financial recording by bby taztsuu, bby taztsuu, pencatatan keuangan, rekap bulanan">
  <meta name="author" content="bby Taztsuu">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase Library (Unpkg CDN - Lebih Stabil & Tanpa Error Block) -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>

  <!-- Pustaka Tambahan: Chart.js & SheetJS (Excel Export) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeIn 0.3s ease-in-out forwards;
    }
    /* Loading Spinner */
    .spinner {
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      width: 14px;
      height: 14px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body class="bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-100 min-h-screen font-sans transition-colors duration-200">

  <!-- ==================== HEADER & NAVBAR ==================== -->
  <header class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 sticky top-0 z-30 transition-colors">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-brand-500 text-white p-2 rounded-xl shadow-md">
          <i class="fa-solid fa-wallet text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight">Financial Recording</h1>
          <p class="text-xs text-gray-400">by bby Taztsuu</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button id="themeToggle" class="p-2 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition">
          <i id="themeIcon" class="fa-solid fa-sun text-yellow-400"></i>
        </button>
        <button id="btnLogout" class="hidden text-xs bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800/50 px-3 py-1.5 rounded-xl hover:bg-rose-100 font-medium transition">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN CONTAINER ==================== -->
  <main class="max-w-5xl mx-auto px-4 py-6">

    <!-- 1. HALAMAN AUTHENTICATION (LOGIN / REGISTER) -->
    <section id="authScreen" class="max-w-md mx-auto my-8 fade-in">
      <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl p-6 shadow-xl">
        
        <!-- Tab Switcher -->
        <div class="flex border-b border-gray-200 dark:border-gray-800 mb-6">
          <button id="tabLogin" class="w-1/2 py-2 font-bold text-sm border-b-2 border-brand-500 text-brand-500">
            Masuk
          </button>
          <button id="tabRegister" class="w-1/2 py-2 font-bold text-sm text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
            Daftar
          </button>
        </div>

        <!-- Form Login -->
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold mb-1 text-gray-500">Username</label>
            <input type="text" id="loginUser" required placeholder="Contoh: taztsuu" class="w-full px-3 py-2 text-sm rounded-xl border border-gray-300 dark:border-gray-700 bg-transparent focus:outline-none focus:border-brand-500">
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1 text-gray-500">PIN Akses</label>
            <input type="password" id="loginPin" required placeholder="••••••" class="w-full px-3 py-2 text-sm rounded-xl border border-gray-300 dark:border-gray-700 bg-transparent focus:outline-none focus:border-brand-500">
          </div>
          <button type="submit" class="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-white rounded-xl text-sm font-semibold transition shadow-md flex items-center justify-center gap-2">
            <span id="loginBtnText">Masuk ke Dashboard</span>
            <div id="loginSpinner" class="spinner hidden"></div>
          </button>
        </form>

        <!-- Form Register -->
        <form id="registerForm" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-semibold mb-1 text-gray-500">Username Baru</label>
            <input type="text" id="regUser" required placeholder="Pilih username unik" class="w-full px-3 py-2 text-sm rounded-xl border border-gray-300 dark:border-gray-700 bg-transparent focus:outline-none focus:border-brand-500">
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1 text-gray-500">Buat PIN (Kerahasiaan)</label>
            <input type="password" id="regPin" required placeholder="••••••" class="w-full px-3 py-2 text-sm rounded-xl border border-gray-300 dark:border-gray-700 bg-transparent focus:outline-none focus:border-brand-500">
          </div>
          <button type="submit" class="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-white rounded-xl text-sm font-semibold transition shadow-md flex items-center justify-center gap-2">
            <span id="regBtnText">Buat Akun Baru</span>
            <div id="regSpinner" class="spinner hidden"></div>
          </button>
        </form>

        <div id="authMsg" class="text-xs text-center mt-4 font-medium hidden"></div>
      </div>
    </section>

    <!-- 2. HALAMAN UTAMA / DASHBOARD -->
    <section id="appScreen" class="hidden space-y-6">
      
      <!-- Welcome Card -->
      <div class="flex items-center justify-between bg-gradient-to-r from-brand-600 to-emerald-700 text-white p-5 rounded-2xl shadow-lg">
        <div>
          <p class="text-xs opacity-80">Selamat Datang Kembali,</p>
          <h2 id="displayUsername" class="text-xl font-bold capitalize">User</h2>
        </div>
        <button id="btnExportExcel" class="text-xs bg-white/20 hover:bg-white/30 backdrop-blur-md px-3 py-2 rounded-xl font-medium transition flex items-center gap-1.5">
          <i class="fa-solid fa-file-excel"></i> Export Excel
        </button>
      </div>

      <!-- Ringkasan Keuangan (Kartu Status) -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-4 rounded-2xl shadow-sm">
          <p class="text-xs text-gray-400 font-medium mb-1">Total Pemasukan</p>
          <h3 id="totalIncome" class="text-xl font-bold text-emerald-500">Rp 0</h3>
        </div>
        <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-4 rounded-2xl shadow-sm">
          <p class="text-xs text-gray-400 font-medium mb-1">Total Pengeluaran</p>
          <h3 id="totalExpense" class="text-xl font-bold text-rose-500">Rp 0</h3>
        </div>
        <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-4 rounded-2xl shadow-sm">
          <p id="saldoLabel" class="text-xs text-gray-400 font-medium mb-1">Total Saldo</p>
          <h3 id="totalBalance" class="text-xl font-bold text-brand-500">Rp 0</h3>
        </div>
      </div>

      <!-- Section Form Input & Visualisasi Chart -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Form Tambah Transaksi -->
        <div class="lg:col-span-2 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-5 rounded-2xl shadow-sm">
          <h3 class="font-bold text-sm mb-4 flex items-center gap-2">
            <i class="fa-solid fa-circle-plus text-brand-500"></i> Catat Transaksi Baru
          </h3>

          <form id="transactionForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
              <button type="button" id="btnIncome" class="py-2 rounded-xl text-xs font-semibold border border-emerald-500 text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/30">
                <i class="fa-solid fa-arrow-down-left mr-1"></i> Pemasukan
              </button>
              <button type="button" id="btnExpense" class="py-2 rounded-xl text-xs font-semibold border border-gray-300 dark:border-gray-600 text-gray-500">
                <i class="fa-solid fa-arrow-up-right mr-1"></i> Pengeluaran
              </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div>
                <label class="block text-xs text-gray-400 mb-1">Jumlah (Rp)</label>
                <input type="number" id="amountInput" required placeholder="0" class="w-full px-3 py-2 text-sm rounded-xl border border-gray-300 dark:border-gray-700 bg-transparent focus:outline-none focus:border-brand-500">
              </div>
              <div>
                <label class="block text-xs text-gray-400 mb-1">Kategori</label>
                <input type="text" id="categoryInput" required placeholder="Gaji, Makanan, Transport, dll" class="w-full px-3 py-2 text-sm rounded-xl border border-gray-300 dark:border-gray-700 bg-transparent focus:outline-none focus:border-brand-500">
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div>
                <label class="block text-xs text-gray-400 mb-1">Tanggal</label>
                <input type="date" id="dateInput" required class="w-full px-3 py-2 text-sm rounded-xl border border-gray-300 dark:border-gray-700 bg-transparent focus:outline-none focus:border-brand-500">
              </div>
              <div>
                <label class="block text-xs text-gray-400 mb-1">Catatan Opsional</label>
                <input type="text" id="noteInput" placeholder="Keterangan singkat" class="w-full px-3 py-2 text-sm rounded-xl border border-gray-300 dark:border-gray-700 bg-transparent focus:outline-none focus:border-brand-500">
              </div>
            </div>

            <button type="submit" class="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-xl text-sm transition shadow-md">
              Simpan Transaksi ke Cloud
            </button>
          </form>
        </div>

        <!-- Visualisasi Chart Bulanan -->
        <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-5 rounded-2xl shadow-sm flex flex-col justify-between">
          <h3 class="font-bold text-sm mb-2 flex items-center gap-2">
            <i class="fa-solid fa-chart-pie text-brand-500"></i> Diagram Rasio
          </h3>
          <div class="relative w-full h-48 flex items-center justify-center">
            <canvas id="financeChart"></canvas>
          </div>
          <p class="text-[11px] text-gray-400 text-center mt-2">Perbandingan Pemasukan vs Pengeluaran</p>
        </div>
      </div>

      <!-- Tabel Riwayat & Filter Bulanan -->
      <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-5 rounded-2xl shadow-sm">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-4">
          <h3 class="font-bold text-sm flex items-center gap-2">
            <i class="fa-solid fa-list-check text-brand-500"></i> Riwayat Transaksi
          </h3>
          
          <div class="flex items-center gap-2">
            <input type="month" id="monthPicker" class="px-3 py-1.5 text-xs rounded-xl border border-gray-300 dark:border-gray-700 bg-transparent focus:outline-none focus:border-brand-500">
            <button id="btnResetFilter" class="text-xs px-2.5 py-1.5 rounded-xl border border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800">
              Semua
            </button>
            <button id="btnClearAll" class="text-xs text-rose-500 hover:text-rose-600 px-2.5 py-1.5 rounded-xl border border-rose-200 dark:border-rose-950">
              Kosongkan
            </button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-gray-200 dark:border-gray-800 text-xs text-gray-400">
                <th class="py-2 px-2 font-medium">Tanggal</th>
                <th class="py-2 px-2 font-medium">Kategori</th>
                <th class="py-2 px-2 font-medium">Catatan</th>
                <th class="py-2 px-2 font-medium text-right">Jumlah</th>
                <th class="py-2 px-2 font-medium text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="transactionList" class="divide-y divide-gray-100 dark:divide-gray-800 text-xs">
              <!-- Data Transaksi dimasukkan via JS -->
            </tbody>
          </table>
        </div>
      </div>

    </section>
  </main>

  <!-- ==================== SCRIPT UTAMA (SUPABASE CLOUD) ==================== -->
  <script>
    // --- INISIALISASI SUPABASE (SINTAKSIS AMAN & STABIL) ---
    const SUPABASE_URL = 'https://mlsvsfedblnazhiitacw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_RffE_kjkKOX4JAhvlaYIBw_x3jRkyir';
    
    // Menggunakan variabel 'db' agar tidak terjadi bentrok nama variabel dengan pustaka utama
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // System State
    let currentUser = localStorage.getItem('bby_active_user') || null;
    let transactions = [];
    let currentType = 'income';
    let myChart = null;

    // Element Selector
    const authScreen = document.getElementById('authScreen');
    const appScreen = document.getElementById('appScreen');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const authMsg = document.getElementById('authMsg');
    const displayUsername = document.getElementById('displayUsername');
    const btnLogout = document.getElementById('btnLogout');

    const form = document.getElementById('transactionForm');
    const btnIncome = document.getElementById('btnIncome');
    const btnExpense = document.getElementById('btnExpense');
    const dateInput = document.getElementById('dateInput');
    const monthPicker = document.getElementById('monthPicker');
    const btnResetFilter = document.getElementById('btnResetFilter');
    const btnExportExcel = document.getElementById('btnExportExcel');
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    // Setting Default Tanggal
    dateInput.value = new Date().toISOString().split('T')[0];
    const now = new Date();
    monthPicker.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

    // --- TAB SWITCHER LOGIC ---
    tabLogin.addEventListener('click', () => {
      tabLogin.className = "w-1/2 py-2 font-bold text-sm border-b-2 border-brand-500 text-brand-500";
      tabRegister.className = "w-1/2 py-2 font-bold text-sm text-gray-400 hover:text-gray-600 dark:hover:text-gray-300";
      loginForm.classList.remove('hidden');
      registerForm.classList.add('hidden');
      hideAuthMsg();
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.className = "w-1/2 py-2 font-bold text-sm border-b-2 border-brand-500 text-brand-500";
      tabLogin.className = "w-1/2 py-2 font-bold text-sm text-gray-400 hover:text-gray-600 dark:hover:text-gray-300";
      registerForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
      hideAuthMsg();
    });

    function showAuthMsg(msg, isError = true) {
      authMsg.innerText = msg;
      authMsg.className = `text-xs text-center mt-4 font-medium ${isError ? 'text-rose-500' : 'text-emerald-500'}`;
      authMsg.classList.remove('hidden');
    }

    function hideAuthMsg() {
      authMsg.classList.add('hidden');
    }

    // --- FITUR REGISTER AKUN (SUPABASE CLOUD) ---
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('regUser').value.trim().toLowerCase();
      const pin = document.getElementById('regPin').value;

      document.getElementById('regBtnText').innerText = 'Mendaftarkan...';
      document.getElementById('regSpinner').classList.remove('hidden');

      try {
        // Cek ketersediaan username di tabel 'users'
        const { data: existingUser } = await db
          .from('users')
          .select('*')
          .eq('username', user)
          .maybeSingle();

        if (existingUser) {
          showAuthMsg('Username sudah terdaftar! Gunakan username lain.');
          resetRegButton();
          return;
        }

        // Pendaftaran ke database cloud
        const { error } = await db
          .from('users')
          .insert([{ username: user, pin: pin }]);

        if (error) throw error;

        showAuthMsg('Akun berhasil dibuat di Cloud! Silakan masuk.', false);
        registerForm.reset();
        tabLogin.click();
      } catch (err) {
        console.error(err);
        showAuthMsg('Terjadi kesalahan saat mendaftar ke server.');
      } finally {
        resetRegButton();
      }
    });

    function resetRegButton() {
      document.getElementById('regBtnText').innerText = 'Buat Akun Baru';
      document.getElementById('regSpinner').classList.add('hidden');
    }

    // --- FITUR LOGIN (SUPABASE CLOUD) ---
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('loginUser').value.trim().toLowerCase();
      const pin = document.getElementById('loginPin').value;

      document.getElementById('loginBtnText').innerText = 'Memverifikasi...';
      document.getElementById('loginSpinner').classList.remove('hidden');

      try {
        const { data: userData, error } = await db
          .from('users')
          .select('*')
          .eq('username', user)
          .eq('pin', pin)
          .maybeSingle();

        if (error || !userData) {
          showAuthMsg('Username atau PIN salah!');
          resetLoginButton();
          return;
        }

        currentUser = user;
        localStorage.setItem('bby_active_user', currentUser);
        loginForm.reset();

        appScreen.classList.add('fade-in');
        await initUserDashboard();
      } catch (err) {
        console.error(err);
        showAuthMsg('Gagal terhubung ke database server.');
      } finally {
        resetLoginButton();
      }
    });

    function resetLoginButton() {
      document.getElementById('loginBtnText').innerText = 'Masuk ke Dashboard';
      document.getElementById('loginSpinner').classList.add('hidden');
    }

    // --- FITUR LOGOUT ---
    btnLogout.addEventListener('click', () => {
      localStorage.removeItem('bby_active_user');
      currentUser = null;
      transactions = [];
      appScreen.classList.add('hidden');
      btnLogout.classList.add('hidden');
      authScreen.classList.remove('hidden');
    });

    // --- INISIALISASI DASHBOARD & AMBIL DATA DARI SUPABASE ---
    async function initUserDashboard() {
      if (!currentUser) return;

      displayUsername.innerText = currentUser;
      authScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
      btnLogout.classList.remove('hidden');

      await fetchTransactionsFromSupabase();
    }

    async function fetchTransactionsFromSupabase() {
      try {
        const { data, error } = await db
          .from('transactions')
          .select('*')
          .eq('username', currentUser)
          .order('date', { ascending: false });

        if (error) throw error;
        transactions = data || [];
        render();
      } catch (err) {
        console.error('Gagal mengambil transaksi:', err);
      }
    }

    // --- DASHBOARD LOGIC & RENDER ---
    btnIncome.addEventListener('click', () => {
      currentType = 'income';
      btnIncome.className = "py-2 rounded-xl text-xs font-semibold border border-emerald-500 text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/30";
      btnExpense.className = "py-2 rounded-xl text-xs font-semibold border border-gray-300 dark:border-gray-600 text-gray-500";
    });

    btnExpense.addEventListener('click', () => {
      currentType = 'expense';
      btnExpense.className = "py-2 rounded-xl text-xs font-semibold border border-rose-500 text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/30";
      btnIncome.className = "py-2 rounded-xl text-xs font-semibold border border-gray-300 dark:border-gray-600 text-gray-500";
    });

    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      themeIcon.className = document.documentElement.classList.contains('dark') ? "fa-solid fa-sun text-yellow-400" : "fa-solid fa-moon text-gray-600";
    });

    function formatRupiah(number) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
    }

    function getFilteredTransactions() {
      const selectedMonth = monthPicker.value;
      if (!selectedMonth) return transactions;
      return transactions.filter(item => item.date.startsWith(selectedMonth));
    }

    function render() {
      const filteredList = getFilteredTransactions();
      const list = document.getElementById('transactionList');
      list.innerHTML = '';

      let incomeSum = 0;
      let expenseSum = 0;

      filteredList.forEach((item) => {
        if (item.type === 'income') incomeSum += Number(item.amount);
        if (item.type === 'expense') expenseSum += Number(item.amount);

        const tr = document.createElement('tr');
        tr.className = "border-b border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/50 transition";
        tr.innerHTML = `
          <td class="py-3 px-2 text-xs text-gray-500">${item.date}</td>
          <td class="py-3 px-2 font-medium">${item.category}</td>
          <td class="py-3 px-2 text-xs text-gray-500">${item.note || '-'}</td>
          <td class="py-3 px-2 text-right font-bold ${item.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}">
            ${item.type === 'income' ? '+' : '-'} ${formatRupiah(item.amount)}
          </td>
          <td class="py-3 px-2 text-center">
            <button onclick="deleteTransaction('${item.id}')" class="text-gray-400 hover:text-rose-500"><i class="fa-solid fa-trash-can"></i></button>
          </td>
        `;
        list.appendChild(tr);
      });

      document.getElementById('saldoLabel').innerText = monthPicker.value ? `Saldo Bulan ${monthPicker.value}` : `Total Saldo Keseluruhan`;
      document.getElementById('totalIncome').innerText = formatRupiah(incomeSum);
      document.getElementById('totalExpense').innerText = formatRupiah(expenseSum);
      document.getElementById('totalBalance').innerText = formatRupiah(incomeSum - expenseSum);

      updateChart(incomeSum, expenseSum);
    }

    monthPicker.addEventListener('change', render);
    btnResetFilter.addEventListener('click', () => {
      monthPicker.value = '';
      render();
    });

    // SIMPAN TRANSAKSI KE SUPABASE CLOUD
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('amountInput').value);
      const category = document.getElementById('categoryInput').value;
      const date = document.getElementById('dateInput').value;
      const note = document.getElementById('noteInput').value;

      const newTransaction = {
        username: currentUser,
        type: currentType,
        amount: amount,
        category: category,
        date: date,
        note: note
      };

      try {
        const { error } = await db
          .from('transactions')
          .insert([newTransaction]);

        if (error) throw error;

        form.reset();
        dateInput.value = new Date().toISOString().split('T')[0];
        monthPicker.value = date.substring(0, 7);

        await fetchTransactionsFromSupabase();
      } catch (err) {
        console.error('Gagal menyimpan transaksi:', err);
        alert('Gagal menyimpan transaksi ke server.');
      }
    });

    // HAPUS TRANSAKSI DARI SUPABASE CLOUD
    window.deleteTransaction = async function(id) {
      if (!confirm('Hapus catatan transaksi ini dari database cloud?')) return;

      try {
        const { error } = await db
          .from('transactions')
          .delete()
          .eq('id', id);

        if (error) throw error;
        await fetchTransactionsFromSupabase();
      } catch (err) {
        console.error('Gagal menghapus:', err);
        alert('Gagal menghapus transaksi dari server.');
      }
    };

    document.getElementById('btnClearAll').addEventListener('click', async () => {
      if (confirm('Apakah Anda yakin ingin menghapus SELURUH catatan keuangan akun ini dari Cloud?')) {
        try {
          const { error } = await db
            .from('transactions')
            .delete()
            .eq('username', currentUser);

          if (error) throw error;
          await fetchTransactionsFromSupabase();
        } catch (err) {
          console.error(err);
          alert('Gagal mengosongkan data.');
        }
      }
    });

    // EXPORT EXCEL
    btnExportExcel.addEventListener('click', () => {
      const dataToExport = getFilteredTransactions();
      if (dataToExport.length === 0) {
        alert('Tidak ada data transaksi untuk diunduh.');
        return;
      }

      const excelRows = dataToExport.map((item, idx) => ({
        'No': idx + 1,
        'Tanggal': item.date,
        'Tipe': item.type === 'income' ? 'Pemasukan' : 'Pengeluaran',
        'Kategori': item.category,
        'Jumlah (Rp)': item.amount,
        'Catatan': item.note || '-'
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Laporan Keuangan');

      const monthName = monthPicker.value ? `_${monthPicker.value}` : '_Semua_Bulan';
      const fileName = `Financial_Recording_${currentUser}${monthName}.xlsx`;

      XLSX.writeFile(workbook, fileName);
    });

    // REKAP CHART
    function updateChart(income, expense) {
      const ctx = document.getElementById('financeChart').getContext('2d');
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Pemasukan', 'Pengeluaran'],
          datasets: [{
            data: [income, expense],
            backgroundColor: ['#22c55e', '#f43f5e'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom' } }
        }
      });
    }

    // CEK SESI LOGIN AKTIF
    if (currentUser) {
      initUserDashboard();
    }
  </script>
</body>
</html>

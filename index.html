  <script>
    // --- INISIALISASI SUPABASE ---
    const SUPABASE_URL = 'https://mlsvsfedblnazhiitacw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_RffE_kjkKOX4JAhvlaYIBw_x3jRkyir';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // System State
    let currentUser = localStorage.getItem('bby_active_user') || null;
    let transactions = [];
    let currentType = 'income';
    let myChart = null;

    // Element Selector
    const authScreen = document.getElementById('authScreen');
    const appScreen = document.getElementById('appScreen');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const authMsg = document.getElementById('authMsg');
    const displayUsername = document.getElementById('displayUsername');
    const btnLogout = document.getElementById('btnLogout');

    const form = document.getElementById('transactionForm');
    const btnIncome = document.getElementById('btnIncome');
    const btnExpense = document.getElementById('btnExpense');
    const dateInput = document.getElementById('dateInput');
    const monthPicker = document.getElementById('monthPicker');
    const btnResetFilter = document.getElementById('btnResetFilter');
    const btnExportExcel = document.getElementById('btnExportExcel');
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    // Default Date Settings
    dateInput.value = new Date().toISOString().split('T')[0];
    const now = new Date();
    monthPicker.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

    // --- FITUR AUTHENTICATION (SUPABASE) ---
    tabLogin.addEventListener('click', () => {
      tabLogin.className = "w-1/2 py-2 font-bold text-sm border-b-2 border-brand-500 text-brand-500";
      tabRegister.className = "w-1/2 py-2 font-bold text-sm text-gray-400 hover:text-gray-600 dark:hover:text-gray-300";
      loginForm.classList.remove('hidden');
      registerForm.classList.add('hidden');
      hideAuthMsg();
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.className = "w-1/2 py-2 font-bold text-sm border-b-2 border-brand-500 text-brand-500";
      tabLogin.className = "w-1/2 py-2 font-bold text-sm text-gray-400 hover:text-gray-600 dark:hover:text-gray-300";
      registerForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
      hideAuthMsg();
    });

    function showAuthMsg(msg, isError = true) {
      authMsg.innerText = msg;
      authMsg.className = `text-xs text-center mt-4 font-medium ${isError ? 'text-rose-500' : 'text-emerald-500'}`;
      authMsg.classList.remove('hidden');
    }

    function hideAuthMsg() {
      authMsg.classList.add('hidden');
    }

    // Register User ke Database Supabase
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('regUser').value.trim().toLowerCase();
      const pin = document.getElementById('regPin').value;

      document.getElementById('regBtnText').innerText = 'Mendaftarkan...';
      document.getElementById('regSpinner').classList.remove('hidden');

      try {
        // Cek apakah username sudah ada di tabel users
        const { data: existingUser } = await supabase
          .from('users')
          .select('*')
          .eq('username', user)
          .single();

        if (existingUser) {
          showAuthMsg('Username sudah terdaftar! Gunakan username lain.');
          resetRegButton();
          return;
        }

        // Simpan user baru ke Supabase
        const { error } = await supabase
          .from('users')
          .insert([{ username: user, pin: pin }]);

        if (error) throw error;

        showAuthMsg('Akun berhasil dibuat di Cloud! Silakan masuk.', false);
        registerForm.reset();
        tabLogin.click();
      } catch (err) {
        console.error(err);
        showAuthMsg('Terjadi kesalahan saat mendaftar.');
      } finally {
        resetRegButton();
      }
    });

    function resetRegButton() {
      document.getElementById('regBtnText').innerText = 'Buat Akun Baru';
      document.getElementById('regSpinner').classList.add('hidden');
    }

    // Login User dengan Verifikasi Supabase
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('loginUser').value.trim().toLowerCase();
      const pin = document.getElementById('loginPin').value;

      document.getElementById('loginBtnText').innerText = 'Memverifikasi...';
      document.getElementById('loginSpinner').classList.remove('hidden');

      try {
        const { data: userData, error } = await supabase
          .from('users')
          .select('*')
          .eq('username', user)
          .eq('pin', pin)
          .single();

        if (error || !userData) {
          showAuthMsg('Username atau PIN salah!');
          resetLoginButton();
          return;
        }

        currentUser = user;
        localStorage.setItem('bby_active_user', currentUser);
        loginForm.reset();

        appScreen.classList.add('fade-in');
        await initUserDashboard();
      } catch (err) {
        console.error(err);
        showAuthMsg('Gagal terhubung ke server database.');
      } finally {
        resetLoginButton();
      }
    });

    function resetLoginButton() {
      document.getElementById('loginBtnText').innerText = 'Masuk ke Dashboard';
      document.getElementById('loginSpinner').classList.add('hidden');
    }

    // Logout
    btnLogout.addEventListener('click', () => {
      localStorage.removeItem('bby_active_user');
      currentUser = null;
      transactions = [];
      appScreen.classList.add('hidden');
      authScreen.classList.remove('hidden');
    });

    // Inisialisasi User Dashboard & Ambil Data dari Supabase
    async function initUserDashboard() {
      if (!currentUser) return;

      displayUsername.innerText = currentUser;
      authScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');

      await fetchTransactionsFromSupabase();
    }

    async function fetchTransactionsFromSupabase() {
      try {
        const { data, error } = await supabase
          .from('transactions')
          .select('*')
          .eq('username', currentUser)
          .order('date', { ascending: false });

        if (error) throw error;
        transactions = data || [];
        render();
      } catch (err) {
        console.error('Gagal memuat transaksi:', err);
      }
    }

    // --- DASHBOARD LOGIC ---
    btnIncome.addEventListener('click', () => {
      currentType = 'income';
      btnIncome.className = "py-2 rounded-xl text-xs font-semibold border border-emerald-500 text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/30";
      btnExpense.className = "py-2 rounded-xl text-xs font-semibold border border-gray-300 dark:border-gray-600 text-gray-500";
    });

    btnExpense.addEventListener('click', () => {
      currentType = 'expense';
      btnExpense.className = "py-2 rounded-xl text-xs font-semibold border border-rose-500 text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/30";
      btnIncome.className = "py-2 rounded-xl text-xs font-semibold border border-gray-300 dark:border-gray-600 text-gray-500";
    });

    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      themeIcon.className = document.documentElement.classList.contains('dark') ? "fa-solid fa-sun text-yellow-400" : "fa-solid fa-moon text-gray-600";
    });

    function formatRupiah(number) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
    }

    function getFilteredTransactions() {
      const selectedMonth = monthPicker.value;
      if (!selectedMonth) return transactions;
      return transactions.filter(item => item.date.startsWith(selectedMonth));
    }

    function render() {
      const filteredList = getFilteredTransactions();
      const list = document.getElementById('transactionList');
      list.innerHTML = '';

      let incomeSum = 0;
      let expenseSum = 0;

      filteredList.forEach((item) => {
        if (item.type === 'income') incomeSum += item.amount;
        if (item.type === 'expense') expenseSum += item.amount;

        const tr = document.createElement('tr');
        tr.className = "border-b border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/50 transition";
        tr.innerHTML = `
          <td class="py-3 px-2 text-xs text-gray-500">${item.date}</td>
          <td class="py-3 px-2 font-medium">${item.category}</td>
          <td class="py-3 px-2 text-xs text-gray-500">${item.note || '-'}</td>
          <td class="py-3 px-2 text-right font-bold ${item.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}">
            ${item.type === 'income' ? '+' : '-'} ${formatRupiah(item.amount)}
          </td>
          <td class="py-3 px-2 text-center">
            <button onclick="deleteTransaction('${item.id}')" class="text-gray-400 hover:text-rose-500"><i class="fa-solid fa-trash-can"></i></button>
          </td>
        `;
        list.appendChild(tr);
      });

      document.getElementById('saldoLabel').innerText = monthPicker.value ? `Saldo Bulan ${monthPicker.value}` : `Total Saldo Keseluruhan`;
      document.getElementById('totalIncome').innerText = formatRupiah(incomeSum);
      document.getElementById('totalExpense').innerText = formatRupiah(expenseSum);
      document.getElementById('totalBalance').innerText = formatRupiah(incomeSum - expenseSum);

      updateChart(incomeSum, expenseSum);
    }

    monthPicker.addEventListener('change', render);
    btnResetFilter.addEventListener('click', () => {
      monthPicker.value = '';
      render();
    });

    // Tambah Transaksi ke Supabase
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('amountInput').value);
      const category = document.getElementById('categoryInput').value;
      const date = document.getElementById('dateInput').value;
      const note = document.getElementById('noteInput').value;

      const newTransaction = {
        username: currentUser,
        type: currentType,
        amount: amount,
        category: category,
        date: date,
        note: note
      };

      try {
        const { error } = await supabase
          .from('transactions')
          .insert([newTransaction]);

        if (error) throw error;

        form.reset();
        dateInput.value = new Date().toISOString().split('T')[0];
        monthPicker.value = date.substring(0, 7);

        await fetchTransactionsFromSupabase();
      } catch (err) {
        console.error('Gagal menyimpan transaksi:', err);
        alert('Gagal menyimpan transaksi ke server.');
      }
    });

    // Hapus Transaksi dari Supabase berdasarkan ID database
    window.deleteTransaction = async function(id) {
      if (!confirm('Hapus catatan transaksi ini?')) return;

      try {
        const { error } = await supabase
          .from('transactions')
          .delete()
          .eq('id', id);

        if (error) throw error;
        await fetchTransactionsFromSupabase();
      } catch (err) {
        console.error('Gagal menghapus:', err);
        alert('Gagal menghapus transaksi dari server.');
      }
    };

    document.getElementById('btnClearAll').addEventListener('click', async () => {
      if (confirm('Apakah Anda yakin ingin menghapus SELURUH catatan keuangan akun ini dari Cloud?')) {
        try {
          const { error } = await supabase
            .from('transactions')
            .delete()
            .eq('username', currentUser);

          if (error) throw error;
          await fetchTransactionsFromSupabase();
        } catch (err) {
          console.error(err);
          alert('Gagal mengosongkan data.');
        }
      }
    });

    btnExportExcel.addEventListener('click', () => {
      const dataToExport = getFilteredTransactions();
      if (dataToExport.length === 0) {
        alert('Tidak ada data transaksi untuk diunduh.');
        return;
      }

      const excelRows = dataToExport.map((item, idx) => ({
        'No': idx + 1,
        'Tanggal': item.date,
        'Tipe': item.type === 'income' ? 'Pemasukan' : 'Pengeluaran',
        'Kategori': item.category,
        'Jumlah (Rp)': item.amount,
        'Catatan': item.note || '-'
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Laporan Keuangan');

      const monthName = monthPicker.value ? `_${monthPicker.value}` : '_Semua_Bulan';
      const fileName = `Financial_Recording_${currentUser}${monthName}.xlsx`;

      XLSX.writeFile(workbook, fileName);
    });

    function updateChart(income, expense) {
      const ctx = document.getElementById('financeChart').getContext('2d');
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Pemasukan', 'Pengeluaran'],
          datasets: [{
            data: [income, expense],
            backgroundColor: ['#22c55e', '#f43f5e'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom' } }
        }
      });
    }

    // Cek status sesi login saat halaman dimuat
    if (currentUser) {
      initUserDashboard();
    }
  </script>
</body>
</html>
